- type: entity
  parent: BaseSign
  id: PosterBase
  abstract: true
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/posters.rsi
    snapCardinals: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0
  - type: ContainerContainer
    containers:
      hidden_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      hidden_slot:
        name: table_slot_hidden
        whitelist:
          tags:
          - ListeningBug

# Legit
- type: entity
  parent: PosterBase
  id: PosterLegitBelieveCat
  name: "Believe!"
  description: "A cat hanging onto a rope with motivational text \"Believe!\" under it... it's... motivational."
  components:
  - type: Sprite
    sprite: _Funkystation/Structures/Wallmounts/posters.rsi
    state: funky_poster1_legit